name = "ubuntu-shop"
main = "src/index.tsx"
compatibility_date = "2026-11-13"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ubuntu-shop-db"
database_id = "8e0c4d53-656f-4b1a-a0a7-01bcec6b1b2e"

[vars]
ENVIRONMENT = "production"
DEFAULT_CURRENCY = "USD"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "ubuntu-shop-products"
